<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Artı Eksi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213d">
<link rel="apple-touch-icon" id="icon" href="">
<title>Artı Eksi</title>
<style>
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#f3f1ec; --card:#ffffff; --fg:#161a24; --mut:#6a7080; --line:#e1ddd3;
  --ink:#14213d; --pmfg:#ffffff; --plus:#1f8a5b; --plus-bg:#dff3e8; --minus:#c2412d; --minus-bg:#fbe3de; --zero-bg:#ebe8e0;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --disp:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --card:#19202f; --fg:#eef0f5; --mut:#97a0b3; --line:#2a3347;
  --ink:#8fb0ff; --pmfg:#0f1420; --plus:#4fd197; --plus-bg:#14352a; --minus:#ff8a74; --minus-bg:#3d1f1a; --zero-bg:#232b3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#19202f; --fg:#eef0f5; --mut:#97a0b3; --line:#2a3347;
  --ink:#8fb0ff; --pmfg:#0f1420; --plus:#4fd197; --plus-bg:#14352a; --minus:#ff8a74; --minus-bg:#3d1f1a; --zero-bg:#232b3d; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.35 var(--font);overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;background:var(--bg);position:sticky;top:0;z-index:2}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{white-space:nowrap;font:700 20px var(--disp);margin:0;letter-spacing:-.01em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:8px 14px;font:600 14px var(--font)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{color:var(--mut);border-style:dashed}
main{flex:1;overflow-y:auto;padding:4px 16px 16px}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;padding:4px 2px 8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:8px}
.row.flash{animation:fl .35s}
@keyframes fl{from{transform:scale(.985)}to{transform:none}}
.nm{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--fg);font:600 16px var(--font);padding:6px 0}
.nm span{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{min-width:44px;text-align:center;border-radius:10px;padding:6px 8px;font:700 17px var(--disp);font-variant-numeric:tabular-nums;background:var(--zero-bg)}
.sc.pos{background:var(--plus-bg);color:var(--plus)} .sc.neg{background:var(--minus-bg);color:var(--minus)}
.sc small{display:block;font:500 10px var(--font);color:var(--mut)}
.pm{width:54px;height:54px;border-radius:14px;border:0;font:700 30px/1 var(--disp);flex:none}
.pm.p{background:var(--plus);color:var(--pmfg)} .pm.m{background:var(--minus);color:var(--pmfg)}
.pm:active{transform:scale(.92)}
nav{display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line);background:var(--bg)}
nav button{font-size:13px!important;padding:12px 2px!important}
nav button,.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 6px;font:600 14px var(--font)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dng{color:var(--minus)}
.ic{white-space:nowrap;padding:8px 9px!important;font-size:12.5px!important;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 12px;font:600 14px var(--font)}
#veil[hidden]{display:none}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:5;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
#sheet h2{font:700 19px var(--disp);margin:0 0 4px}
#sheet p{color:var(--mut);margin:6px 0 12px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:flex;gap:8px}
input[type=text],textarea,select{width:100%;font:16px var(--font);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
textarea{min-height:90px}
.pv{display:flex;gap:8px;align-items:center;padding:4px 0}
.pv input[type=checkbox]{width:22px;height:22px;flex:none}
.pv span{color:var(--mut);font-size:12px;width:38px;flex:none}
.log{font-size:14px;display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right} td:first-child,th:first-child{text-align:left}
.lbl{flex:none;align-self:center;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding-right:2px}
.chip.sm{padding:6px 12px;font-size:13px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:10px;padding:8px 12px;font:600 14px var(--font)}
.cat.on{background:var(--card);color:var(--fg);border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty h2{color:var(--fg);font:700 20px var(--disp)}
.note{font-size:12px;color:var(--mut);text-align:center;padding:6px 0}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="top"><h1>Artı Eksi</h1><div class="two"><button class="ic" id="thm"></button><button class="ic" id="priv"></button><button class="ic" id="sort"></button></div></div>
    <div class="chips" id="chips"></div>
    <div class="cats" id="ders"></div>
    <div class="cats" id="cats"></div>
  </header>
  <main id="list"></main>
  <nav><button id="bCls">Sınıflar</button><button id="bImp">Liste yükle</button><button id="bAdd">Öğrenci ekle</button><button id="bRep">Rapor</button><button id="bBak">Yedek</button></nav>
</div>
<div id="veil" hidden><div id="sheet"></div></div>

<script>
var KEY='artieksi.v1', mem=null;
var CATS=[{id:'d',n:'Defter kontrolü',s:'Defter'},{id:'m',n:'Meyve getirme',s:'Meyve'},{id:'o',n:'Ödev',s:'Ödev'},{id:'u',n:'Ders için düzen',s:'Düzen'}];
function init(){return {classes:[],cur:null,privacy:false,sort:'list',cat:'d',theme:'auto'}}
var T0=document.documentElement.getAttribute('data-theme');
function applyTheme(){var r=document.documentElement,t=S.theme||'auto';if(t==='auto'){if(T0)r.setAttribute('data-theme',T0);else r.removeAttribute('data-theme')}else r.setAttribute('data-theme',t);$('#thm').textContent=t==='dark'?'☾ Koyu':t==='light'?'☀ Açık':'◐ Oto'}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||init()}
var S=load();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function $(s){return document.querySelector(s)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cls(){return S.classes.find(function(c){return c.id===S.cur})||S.classes[0]||null}
function cat(){return CATS.some(function(k){return k.id===S.cat})?S.cat:'d'}
function catOf(id){return CATS.filter(function(k){return k.id===id})[0]||{n:'Genel',s:'Genel'}}
function disp(c){return c.name+(c.ders?' · '+c.ders:'')}
function tally(s,c,since){var p=0,m=0;s.log.forEach(function(l){if(c&&l.c!==c)return;if(since&&l.t<since)return;l.v>0?p++:m++});return {p:p,m:m,n:p-m}}
function shown(s){if(!S.privacy)return s.name;var w=s.name.split(' ');return w.length>1?w.slice(0,-1).join(' ')+' '+w[w.length-1][0]+'.':s.name}
function titleCase(t){return t.toLocaleLowerCase('tr').split(/\s+/).map(function(w){return w.charAt(0).toLocaleUpperCase('tr')+w.slice(1)}).join(' ')}

/* ---------- ana ekran ---------- */
function render(){
  applyTheme();
  $('#priv').textContent=S.privacy?'İsim gizli':'İsim açık';
  $('#sort').textContent=S.sort==='list'?'Liste sırası':'Puana göre';
  var seen={},ch='',cc=cls();
  if(cc){S.last=S.last||{};S.last[cc.name]=cc.id}
  S.classes.forEach(function(c){if(seen[c.name])return;seen[c.name]=1;ch+='<button class="chip'+(cc&&c.name===cc.name?' on':'')+'" data-c="'+c.id+'">'+esc(c.name)+'</button>'});
  var dh='';if(cc){dh='<span class="lbl">Ders</span>';S.classes.filter(function(x){return x.name===cc.name}).forEach(function(x){dh+='<button class="chip sm'+(x.id===cc.id?' on':'')+'" data-d="'+x.id+'">'+esc(x.ders||'Genel')+'</button>'});dh+='<button class="chip sm add" data-d="new">+ Ders</button>'}
  $('#ders').innerHTML=dh;
  $('#chips').innerHTML=ch+'<button class="chip add" data-c="new">+ Sınıf</button><button class="chip add" data-c="mng">Yönet</button>';
  $('#cats').innerHTML='<span class="lbl">Not</span>'+CATS.map(function(k){return '<button class="cat'+(k.id===cat()?' on':'')+'" data-k="'+k.id+'">'+k.n+'</button>'}).join('');
  var c=cls(), L=$('#list'), ck=cat();
  if(!c){L.innerHTML='<div class="empty"><h2>Henüz sınıf yok</h2><p>Excel, CSV, PDF ya da yapıştırdığın listeden öğrencileri yükle. Dosya telefonundan çıkmaz.</p><div class="stack"><button class="btn pri" data-a="imp">Liste yükle</button><button class="btn" data-a="demo">Örnek sınıfı dene</button></div></div>';return}
  var st=c.students.slice();
  if(S.sort==='score')st.sort(function(a,b){return tally(b,ck).n-tally(a,ck).n});
    L.innerHTML='<div class="bar"><span>'+c.students.length+' öğrenci · '+catOf(ck).n+'</span><span>Bugün: +'+todayCount(c,1)+' / −'+todayCount(c,-1)+'</span></div>'+
  st.map(function(s){var t=tally(s,ck),all=tally(s);
    return '<div class="row" data-s="'+s.id+'"><button class="nm" data-a="det"><b>'+esc(shown(s))+'</b>'+'<span>'+(s.no?'No '+esc(s.no)+' · ':'')+'Toplam '+(all.n>0?'+':'')+all.n+'</span>'+'</button>'+
    '<div class="sc '+(t.n>0?'pos':t.n<0?'neg':'')+'">'+(t.n>0?'+':'')+t.n+'<small>+'+t.p+' −'+t.m+'</small></div>'+
    '<button class="pm m" data-a="m" aria-label="Eksi">−</button><button class="pm p" data-a="p" aria-label="Artı">+</button></div>'}).join('')||'<div class="empty">Bu sınıfta öğrenci yok.</div>';
}
function todayCount(c,sign){var d=new Date();d.setHours(0,0,0,0);var n=0;c.students.forEach(function(s){s.log.forEach(function(l){if(l.t>=d.getTime()&&(l.v>0)===(sign>0))n++})});return n}

$('#list').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
  if(a==='imp')return openImport(); if(a==='demo')return demo();
  var row=b.closest('[data-s]');if(!row)return;var s=cls().students.find(function(x){return x.id===row.dataset.s});
  if(a==='det')return openStudent(s);
  s.log.push({t:Date.now(),v:a==='p'?1:-1,c:cat()});save();
  var y=$('#list').scrollTop;render();$('#list').scrollTop=y;
  var r=document.querySelector('[data-s="'+s.id+'"]');if(r)r.classList.add('flash');
});
$('#chips').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;
  if(b.dataset.c==='new')return openNewClass(); if(b.dataset.c==='mng')return openClasses(); var c0=S.classes.find(function(x){return x.id===b.dataset.c});var t=(S.last&&S.classes.find(function(x){return x.id===S.last[c0.name]}))||c0;S.cur=t.id;save();render()});
$('#ders').addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(!b)return;if(b.dataset.d==='new')return openAddDers();S.cur=b.dataset.d;save();render()});
$('#cats').addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;S.cat=b.dataset.k;save();render()});
$('#thm').onclick=function(){S.theme=S.theme==='auto'?'dark':S.theme==='dark'?'light':'auto';save();applyTheme()};
$('#priv').onclick=function(){S.privacy=!S.privacy;save();render()};
$('#sort').onclick=function(){S.sort=S.sort==='list'?'score':'list';save();render()};
$('#bCls').onclick=openClasses; $('#bImp').onclick=openImport; $('#bAdd').onclick=openAddStudent; $('#bRep').onclick=openReport; $('#bBak').onclick=openBackup;

/* ---------- sheet ---------- */
function sheet(html){$('#sheet').innerHTML=html;$('#veil').hidden=false}
function closeSheet(){$('#veil').hidden=true;$('#sheet').innerHTML=''}
$('#veil').addEventListener('click',function(e){if(e.target.id==='veil')closeSheet()});
function closeBtn(){return '<button class="btn" onclick="closeSheet()">Kapat</button>'}

function openClasses(){
  var cur=cls();
  var rows=S.classes.map(function(c){return '<div class="row" data-id="'+c.id+'"><button class="nm" data-a="open"><b>'+esc(disp(c))+(cur&&c.id===cur.id?' (açık)':'')+'</b><span>'+c.students.length+' öğrenci</span></button><button class="ic" data-a="ren">Ad</button><button class="ic dng" data-a="del">Sil</button></div>'}).join('')||'<div class="empty">Henüz sınıf yok.</div>';
  sheet('<h2>Sınıflar</h2><p>Bir sınıfa dokun, açılsın. Adı değiştirebilir ya da sınıfı silebilirsin.</p>'+rows+'<div class="stack" style="margin-top:12px"><button class="btn pri" id="nw">Yeni sınıf</button><button class="btn" id="up">Liste yükle</button>'+closeBtn()+'</div>');
  $('#nw').onclick=openNewClass;$('#up').onclick=openImport;
  $('#sheet').onclick=function(e){
    var b=e.target.closest('[data-a]');if(!b)return;var r=b.closest('[data-id]');if(!r)return;
    var c=S.classes.find(function(x){return x.id===r.dataset.id}),a=b.dataset.a;
    if(a==='open'){S.cur=c.id;save();closeSheet();render()}
    if(a==='ren'){sheet('<h2>Sınıf ve ders adı</h2><div class="stack"><input type="text" id="rn" value="'+esc(c.name)+'" placeholder="Sınıf"><input type="text" id="rd" value="'+esc(c.ders||'')+'" placeholder="Ders (isteğe bağlı)"><button class="btn pri" id="ok">Kaydet</button><button class="btn" id="bk">Geri</button></div>');
      $('#ok').onclick=function(){var n=$('#rn').value.trim();if(n){c.name=n;c.ders=$('#rd').value.trim();save();render()}openClasses()};$('#bk').onclick=openClasses}
    if(a==='del'){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Emin misin?';return}
      S.classes=S.classes.filter(function(x){return x!==c});if(S.cur===c.id)S.cur=S.classes[0]?S.classes[0].id:null;save();render();openClasses()}
  };
}
function openNewClass(){
  sheet('<h2>Yeni sınıf</h2><div class="stack"><input type="text" id="cn" placeholder="Sınıf, örn. 9-AMP" autocomplete="off"><input type="text" id="cd" placeholder="Ders (isteğe bağlı)" autocomplete="off"><button class="btn pri" id="ok">Oluştur</button>'+closeBtn()+'</div>');
  $('#ok').onclick=function(){var n=$('#cn').value.trim();if(!n)return;var c={id:uid(),name:n,ders:$('#cd').value.trim(),students:[]};S.classes.push(c);S.cur=c.id;save();closeSheet();render()};
}
function openAddDers(){
  var c=cls();if(!c)return;
  sheet('<h2>Yeni ders</h2><p>'+esc(c.name)+' sınıfının öğrencileri yeni derse kopyalanır. Puanlar her derste ayrı tutulur.</p><div class="stack"><input type="text" id="cd" placeholder="Ders adı" autocomplete="off"><button class="btn pri" id="ok">Ekle</button>'+closeBtn()+'</div>');
  $('#ok').onclick=function(){var d=$('#cd').value.trim();if(!d)return;var n={id:uid(),name:c.name,ders:d,students:c.students.map(function(s){return {id:uid(),name:s.name,no:s.no,log:[]}})};S.classes.push(n);S.cur=n.id;save();closeSheet();render()};
}
function openAddStudent(){
  if(!cls())return openNewClass();
  sheet('<h2>Öğrenci ekle</h2><p>'+esc(disp(cls()))+' sınıfına</p><div class="stack"><input type="text" id="sn" placeholder="Ad Soyad" autocomplete="off"><input type="text" id="sno" placeholder="Okul no (isteğe bağlı)" inputmode="numeric"><button class="btn pri" id="ok">Ekle</button>'+closeBtn()+'</div>');
  $('#ok').onclick=function(){var n=$('#sn').value.trim();if(!n)return;cls().students.push({id:uid(),name:titleCase(n),no:$('#sno').value.trim(),log:[]});save();closeSheet();render()};
}
function openStudent(s){
  var t=tally(s),h=s.log.slice(-25).reverse().map(function(l){var d=new Date(l.t);
    return '<div class="log"><span style="color:var(--'+(l.v>0?'plus':'minus')+')">'+((l.v>0?'+ ':'− ')+catOf(l.c).n)+'</span><span>'+d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'</span></div>'}).join('')||'<p>Henüz kayıt yok.</p>';
  sheet('<h2>'+esc(s.name)+'</h2><p>'+(s.no?'No '+esc(s.no)+' · ':'')+'+'+t.p+' / −'+t.m+' · net '+t.n+'</p><p>'+CATS.map(function(k){var q=tally(s,k.id);return k.s+' +'+q.p+'/−'+q.m}).join(' · ')+'</p>'+h+
    '<div class="stack" style="margin-top:14px"><button class="btn" id="un">Son kaydı geri al</button><button class="btn dng" id="del">Öğrenciyi sil</button>'+closeBtn()+'</div>');
  $('#un').onclick=function(){s.log.pop();save();closeSheet();render()};
  $('#del').onclick=function(){$('#del').textContent='Silmek için tekrar dokun';$('#del').onclick=function(){var c=cls();c.students=c.students.filter(function(x){return x!==s});save();closeSheet();render()}};
}

/* ---------- içe aktarma ---------- */
var HEAD=['no','sıra','sıra no','okul no','numara','adı','ad','soyadı','soyad','adı soyadı','öğrenci no','cinsiyet','sınıf','şube','t.c.','tc kimlik no','öğrenci adı soyadı'];
var GEN=['erkek','kız','kadın','e','k'];
var LATIN={'Ý':'İ','ý':'ı','Þ':'Ş','þ':'ş','Ð':'Ğ','ð':'ğ'};
function fixTr(s){return String(s==null?'':s).normalize('NFC').replace(/[ÝýÞþÐð]/g,function(c){return LATIN[c]})}
var INFO=[];
function fold(s){return String(s).toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z]/g,'')}
function labelVal(cells){var j=cells.join(' '),k=j.indexOf(':');return (k>-1?j.slice(k+1):cells.slice(1).join(' ')).replace(/^[:\s]+/,'').replace(/\s+/g,' ').trim()}
function niceClass(v){
  var s=v.replace(/^[A-ZÇĞİÖŞÜ]{2,6}\s*[-–]\s*/,'').replace(/\s+/g,' ').trim(),t=s.split(/[\s\/.\-–]+/).filter(Boolean),g='',l='';
  t.forEach(function(w){var m=w.match(/^(\d{1,2})([A-ZÇĞİÖŞÜ])?$/);if(m&&!g){g=m[1];if(m[2])l=m[2];return}if(g&&!l&&/^[A-ZÇĞİÖŞÜ]$/.test(w))l=w});
  return g?(l?g+' '+l:g):s;
}
function stripGender(n){var t=n.split(' ');while(t.length>2&&/^[EK]$/i.test(t[t.length-1]))t.pop();while(t.length>2&&/^[EK]$/i.test(t[0]))t.shift();return t.join(' ')}
function parseRows(rows,def){
  var cand=[],cur=def||'Yeni sınıf',root=cur,nn=1,last=0,curD='',pend='';
  function setClass(v){v=niceClass(v.replace(/\s*\.?\s*s[ıi]n(?:[ıi]f)?\.?$/i,'').replace(/\s+/g,' ').trim());if(v){cur=v;root=v;nn=1;last=0;curD=''}}
  rows.forEach(function(r){
    var cells=r.map(function(x){return fixTr(x).trim()}).filter(Boolean);
    if(!cells.length)return;
    function info(){if(INFO.length<40)INFO.push(cells.join('  |  ').slice(0,140))}
    var fj=fold(cells.join(' '));
    if(pend&&/^:/.test(cells[0])){var pv=cells.join(' ').replace(/^[:\s]+/,'').trim();if(pend==='c')setClass(pv);else curD=pv;pend='';info();return}
    pend='';
    if(/^(sinifi?|snf|sinf|nif)?sube/.test(fj)){var v=labelVal(cells);if(!(v&&HEAD.indexOf(v.toLocaleLowerCase('tr'))>-1)){info();if(v)setClass(v);else pend='c';return}}
    if(/^ders(in)?adi/.test(fj)){var d=labelVal(cells);info();if(d)curD=d;else pend='d';return}
    if(cells.some(function(c){return c.indexOf(':')>-1||HEAD.indexOf(c.toLocaleLowerCase('tr'))>-1})){info();return}
    var pre=[],post=[],nm=[],started=false;
    cells.forEach(function(c){
      if(/^\d{1,7}$/.test(c)){if(started){if(!post.length)post.push(c)}else pre.push(c);return}
      if(/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(c)&&GEN.indexOf(c.toLocaleLowerCase('tr'))<0){if(started&&post.length)return;started=true;nm.push(c)}
    });
    var name=nm.join(' ').replace(/[^A-Za-zÇĞİÖŞÜçğıöşü\s'.-]/g,' ').replace(/\s+/g,' ').trim();
    name=stripGender(name);
    if(name.length<3){if(!pre.length)info();return}
    if(/(öğretmen|müdür|toplam|ortalama|başarı|imza|onay|yardımcı|tarih|okul|şube|sınıf)/.test(name.toLocaleLowerCase('tr'))){info();return}
    if(pre.length){var sq=parseInt(pre[0],10);if(sq===1&&last>1){nn++;cur=root+' '+nn}last=sq}
    var no=pre.length?pre[pre.length-1]:(post[0]||'');
    if(pre.length===1&&pre[0].length<=2&&post[0]&&post[0].length>=3)no=post[0];
    cand.push({name:titleCase(name),no:no,cls:cur,ders:curD,has:pre.length>0||post.length>0});
  });
  return cand;
}
function parseAll(segs,base){
  var all=[];INFO.length=0;
  segs.forEach(function(sg){var d=/^(sayfa|sheet)\s*\d*$/i.test(sg.label||'')?'':sg.label;all=all.concat(parseRows(sg.rows,d||base||'Yeni sınıf'))});
  var wn=all.filter(function(c){return c.has});if(wn.length>=3)all=wn;
  var g=[],idx={};
  all.forEach(function(c){var k=c.cls+'||'+c.ders;if(!(k in idx)){idx[k]=g.length;g.push({name:c.cls,ders:c.ders,students:[]})}g[idx[k]].students.push({name:c.name,no:c.no})});
  return g;
}
function groupLines(items){
  items=items.filter(function(i){return i.s.trim()});
  var hs=items.map(function(i){return i.h||8}).sort(function(a,b){return a-b}),mh=hs[Math.floor(hs.length/2)]||8,tol=Math.max(2.5,mh*0.6);
  items.sort(function(a,b){return b.y-a.y});
  var lines=[],cur=null;
  items.forEach(function(it){if(cur&&cur.y-it.y<=tol)cur.it.push(it);else{cur={y:it.y,it:[it]};lines.push(cur)}});
  return lines.map(function(l){
    var cells=[],prev=null;
    l.it.sort(function(a,b){return a.x-b.x}).forEach(function(o){
      if(prev&&o.x-(prev.x+prev.w)<0.12*(o.h||8)){prev.s+=o.s;prev.w=o.x+(o.w||0)-prev.x}
      else{prev={s:o.s,x:o.x,w:o.w||0};cells.push(prev)}
    });
    return cells.map(function(c){return c.s});
  });
}
function textToRows(t){return t.split(/\r?\n/).map(function(l){return l.indexOf('\t')>-1?l.split('\t'):l.indexOf(';')>-1?l.split(';'):l.indexOf(',')>-1&&l.split(',').length<=4?l.split(','):l.trim().split(/\s+/)})}
function loadScript(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){no(new Error('Kütüphane yüklenemedi. İnternet bağlantısını kontrol et.'))};document.head.appendChild(s)})}
async function readFile(f){
  var ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv'||ext==='txt'){return [{label:'',rows:textToRows(await f.text())}]}
  if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    var wb=XLSX.read(await f.arrayBuffer());return wb.SheetNames.map(function(n){return {label:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})}});
  }
  if(ext==='pdf'){
    if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
    var pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,rows2=[];
    for(var i=1;i<=pdf.numPages;i++){
      var tc=(await (await pdf.getPage(i)).getTextContent()).items.map(function(it){return {s:it.str,x:it.transform[4],y:it.transform[5],h:it.height,w:it.width}});
      rows2=rows2.concat(groupLines(tc));
    }
    return [{label:'',rows:rows2}];
  }
  throw new Error('Bu dosya türü desteklenmiyor. xlsx, csv, pdf ya da txt kullan.');
}
function openImport(){
  sheet('<h2>Liste yükle</h2><p>Dosya telefonunda okunur, hiçbir yere gönderilmez. Excel ve CSV en doğru sonucu verir. PDF için önizlemeyi kontrol et.</p><div class="stack">'+
    '<input type="file" id="f" accept=".xlsx,.xls,.csv,.pdf,.txt">'+
    '<textarea id="tx" placeholder="ya da listeyi buraya yapıştır (satır başına bir öğrenci)"></textarea>'+
    '<button class="btn pri" id="go">Listeyi oku</button><div id="msg" class="note"></div>'+closeBtn()+'</div>');
  $('#go').onclick=async function(){
    var msg=$('#msg');msg.textContent='Okunuyor…';
    try{
      var f=$('#f').files[0],segs=f?await readFile(f):[{label:'',rows:textToRows($('#tx').value)}];
      var groups=parseAll(segs,f?f.name.replace(/\.[^.]+$/,''):'');
      if(!groups.length){msg.textContent='Öğrenci bulunamadı. Excel ya da yapıştırma dene.';return}
      preview(groups);
    }catch(err){msg.textContent=err.message}
  };
}
function preview(groups){
  var total=groups.reduce(function(n,g){return n+g.students.length},0),cur=cls(),html='';
  html+='<h2>'+total+' öğrenci, '+groups.length+' sınıf bulundu</h2><p>Her sınıf ayrı eklenir. Sınıf adını ve yanlış okunan isimleri düzelt, istemediklerinin işaretini kaldır.</p>';
  if(groups.length===1&&cur)html+='<div class="stack"><select id="tgt"><option value="new">Yeni sınıf olarak ekle</option><option value="'+cur.id+'">'+esc(disp(cur))+' sınıfına ekle</option></select></div>';
  groups.forEach(function(g,gi){
    html+='<label style="display:flex;gap:8px;align-items:center;margin-top:16px;font-weight:600"><input type="checkbox" checked data-gall="'+gi+'" style="width:22px;height:22px"> Bu sınıfı ekle</label><div class="two" style="margin:8px 0 4px"><input type="text" data-g="'+gi+'" value="'+esc(g.name)+'" placeholder="Sınıf" style="font-weight:700"><input type="text" data-dd="'+gi+'" value="'+esc(g.ders||'')+'" placeholder="Ders (isteğe bağlı)"></div><div class="note" style="text-align:left">'+g.students.length+' öğrenci</div>'+
      g.students.map(function(s,i){return '<div class="pv"><input type="checkbox" checked data-i="'+gi+'-'+i+'"><span>'+esc(s.no)+'</span><input type="text" data-n="'+gi+'-'+i+'" value="'+esc(s.name)+'"></div>'}).join('');
  });
  if(INFO.length)html+='<details style="margin-top:14px"><summary style="color:var(--mut);font-size:13px">Dosyadan okunan başlık satırları ('+INFO.length+')</summary><pre style="white-space:pre-wrap;font-size:11px;color:var(--mut)">'+esc(INFO.join('\n'))+'</pre></details>';
  sheet(html+'<div class="stack" style="margin-top:14px"><button class="btn pri" id="ok">İçe aktar</button>'+closeBtn()+'</div>');
  document.querySelectorAll('[data-gall]').forEach(function(bx){bx.onchange=function(){var on=this.checked;document.querySelectorAll('[data-i^="'+this.dataset.gall+'-"]').forEach(function(x){x.checked=on})}});
  $('#ok').onclick=function(){
    var first=null,tgt=$('#tgt')?$('#tgt').value:'new';
    groups.forEach(function(g,gi){
      var add=[];g.students.forEach(function(s,i){if(document.querySelector('[data-i="'+gi+'-'+i+'"]').checked){var n=document.querySelector('[data-n="'+gi+'-'+i+'"]').value.trim();if(n)add.push({id:uid(),name:n,no:s.no,log:[]})}});
      if(!add.length)return;
      var nm=document.querySelector('[data-g="'+gi+'"]').value.trim()||'Yeni sınıf',dd=document.querySelector('[data-dd="'+gi+'"]').value.trim(),c=null;
      if(groups.length===1&&tgt!=='new')c=S.classes.find(function(x){return x.id===tgt});
      if(!c)c=S.classes.find(function(x){return x.name.toLocaleLowerCase('tr')===nm.toLocaleLowerCase('tr')&&(x.ders||'').toLocaleLowerCase('tr')===dd.toLocaleLowerCase('tr')});
      if(!c){c={id:uid(),name:nm,ders:dd,students:[]};S.classes.push(c)}
      c.students=c.students.concat(add);if(!first)first=c;
    });
    if(first)S.cur=first.id;save();closeSheet();render();
  };
}

/* ---------- rapor ve yedek ---------- */
var rp='all';
var PER=[['all','Tümü'],['today','Bugün'],['week','Bu hafta'],['month','Bu ay']];
function sinceOf(p){var d=new Date();d.setHours(0,0,0,0);if(p==='today')return d.getTime();if(p==='week'){d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}if(p==='month'){d.setDate(1);return d.getTime()}return 0}
function perLabel(){return PER.filter(function(x){return x[0]===rp})[0][1]}
function repData(c){var sn=sinceOf(rp);return c.students.map(function(s){var per={};CATS.forEach(function(k){per[k.id]=tally(s,k.id,sn)});return {s:s,per:per,tot:tally(s,null,sn)}})}
function toCSV(){
  var c=cls(),h=['Sınıf','Ders','No','Ad Soyad'];CATS.forEach(function(k){h.push(k.n+' +',k.n+' −')});h.push('Artı','Eksi','Net');
  var r=[h];repData(c).forEach(function(d){var row=[c.name,c.ders||'',d.s.no,d.s.name];CATS.forEach(function(k){row.push(d.per[k.id].p,d.per[k.id].m)});row.push(d.tot.p,d.tot.m,d.tot.n);r.push(row)});
  return '﻿'+r.map(function(x){return x.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(';')}).join('\n');
}
function giveText(text){
  sheet('<h2>Metni kopyala</h2><p>Bu görünümde dosya kaydı kapalı. Metni seçip kopyala.</p><textarea id="cp" readonly style="min-height:200px;font-size:13px"></textarea><div class="stack" style="margin-top:12px">'+closeBtn()+'</div>');
  var t=$('#cp');t.value=text.replace(/^﻿/,'');t.focus();t.select();
}
async function saveFile(name,data){
  var d=null;try{d=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
  if(d){try{await d.save({filename:name,data:data});return 'saved'}catch(e){if(e&&e.code==='declined')return 'declined'}}
  var ext=name.split('.').pop().toLowerCase(),type=ext==='pdf'?'application/pdf':ext==='csv'?'text/csv;charset=utf-8':'application/json';
  var blob=data instanceof Blob?data:new Blob([data],{type:type}),file=new File([blob],name,{type:type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return 'saved'}}catch(e){if(e&&e.name==='AbortError')return 'declined'}
  try{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return 'saved'}catch(e){}
  if(typeof data==='string'){giveText(data);return 'copy'}
  return 'none';
}
async function makePDF(c){
  if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  var data=repData(c),W=1240,H=1754,RH=44,TOP=204,per=Math.floor((H-TOP-90)/RH),pages=Math.max(1,Math.ceil(data.length/per));
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),cv=document.createElement('canvas');cv.width=W;cv.height=H;var x=cv.getContext('2d');
  var F='-apple-system,Helvetica,Arial,sans-serif',R0=480,CW=150;
  function clip(t,w){while(t.length>3&&x.measureText(t).width>w)t=t.slice(0,-2);return t}
  for(var p=0;p<pages;p++){
    x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
    x.fillStyle='#161a24';x.textAlign='left';x.font='bold 44px '+F;x.fillText('Artı Eksi Raporu',60,80);
    x.fillStyle='#6a7080';x.font='26px '+F;x.fillText(disp(c)+'  ·  '+perLabel()+'  ·  '+new Date().toLocaleDateString('tr-TR'),60,126);
    x.fillStyle='#14213d';x.fillRect(60,160,W-110,44);
    x.fillStyle='#ffffff';x.font='bold 22px '+F;x.textAlign='left';x.fillText('Öğrenci',72,191);x.textAlign='right';
    CATS.forEach(function(k,i){x.fillText(k.s,R0+CW*(i+1)-14,191)});x.fillText('Net',W-64,191);
    data.slice(p*per,(p+1)*per).forEach(function(d,i){
      var y=TOP+i*RH;if(i%2){x.fillStyle='#f3f1ec';x.fillRect(60,y,W-110,RH)}
      x.fillStyle='#161a24';x.font='24px '+F;x.textAlign='left';x.fillText(clip(shown(d.s),400),72,y+31);
      x.textAlign='right';CATS.forEach(function(k,j){var q=d.per[k.id];x.fillStyle=q.p||q.m?'#161a24':'#a0a5b0';x.fillText('+'+q.p+' / −'+q.m,R0+CW*(j+1)-14,y+31)});
      x.font='bold 24px '+F;x.fillStyle=d.tot.n>0?'#1f8a5b':d.tot.n<0?'#c2412d':'#161a24';x.fillText((d.tot.n>0?'+':'')+d.tot.n,W-64,y+31);
    });
    x.fillStyle='#6a7080';x.font='20px '+F;x.textAlign='center';x.fillText('Sayfa '+(p+1)+' / '+pages,W/2,H-40);
    if(p>0)doc.addPage();doc.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297);
  }
  return doc.output('blob');
}
function openReport(){
  var c=cls();if(!c)return;
  var rows=repData(c).map(function(d){return '<tr><td>'+esc(shown(d.s))+'</td>'+CATS.map(function(k){var q=d.per[k.id];return '<td>+'+q.p+'/−'+q.m+'</td>'}).join('')+'<td><b>'+(d.tot.n>0?'+':'')+d.tot.n+'</b></td></tr>'}).join('');
  sheet('<h2>'+esc(disp(c))+' raporu</h2><div class="stack"><select id="per">'+PER.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===rp?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div>'+
    '<div style="overflow-x:auto;margin-top:10px"><table><tr><th>Öğrenci</th>'+CATS.map(function(k){return '<th>'+k.s+'</th>'}).join('')+'<th>Net</th></tr>'+rows+'</table></div>'+
    '<div class="stack" style="margin-top:14px"><button class="btn pri" id="pdf">PDF olarak kaydet</button><button class="btn" id="csv">Excel için kaydet (CSV)</button><div id="msg" class="note"></div><button class="btn dng" id="rs">Bu sınıfın puanlarını sıfırla</button>'+closeBtn()+'</div>');
  $('#per').onchange=function(){rp=this.value;openReport()};
  $('#pdf').onclick=async function(){var m=$('#msg');m.textContent='PDF hazırlanıyor…';try{var r=await saveFile('artieksi-'+disp(c)+'-rapor.pdf',await makePDF(c));m.textContent=r==='saved'?'Kaydedildi.':r==='none'?'Bu görünümde dosya kaydı kapalı.':''}catch(e){m.textContent='PDF hazırlanamadı. İnternet bağlantısını kontrol et.'}};
  $('#csv').onclick=async function(){var r=await saveFile('artieksi-'+disp(c)+'-rapor.csv',toCSV());if(r==='saved')$('#msg').textContent='Kaydedildi.'};
  $('#rs').onclick=function(){$('#rs').textContent='Sıfırlamak için tekrar dokun';$('#rs').onclick=function(){c.students.forEach(function(s){s.log=[]});save();closeSheet();render()}};
}
function restore(txt){try{var d=JSON.parse(txt);if(!d.classes)throw 0;S=d;save();closeSheet();render()}catch(x){$('#msg').textContent='Bu geçerli bir yedek değil.'}}
function openBackup(){
  sheet('<h2>Yedek</h2><p>Veriler yalnızca bu telefonda durur. Telefonu değiştirirsen ya da uygulamayı silersen yedekten geri yükle.</p><div class="stack">'+
    '<button class="btn pri" id="ex">Yedeği kaydet</button><input type="file" id="im" accept=".json"><textarea id="pj" placeholder="ya da yedek metnini buraya yapıştır"></textarea><button class="btn" id="rj">Yapıştırılan yedeği geri yükle</button><div id="msg" class="note"></div>'+
    '<button class="btn dng" id="wipe">Tüm verileri sil</button>'+closeBtn()+'</div>');
  $('#ex').onclick=function(){saveFile('artieksi-yedek.json',JSON.stringify(S))};
  $('#im').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){restore(r.result)};r.readAsText(f)};
  $('#rj').onclick=function(){restore($('#pj').value)};
  $('#wipe').onclick=function(){$('#wipe').textContent='Silmek için tekrar dokun';$('#wipe').onclick=function(){S=init();save();closeSheet();render()}};
}
